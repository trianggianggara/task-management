definitions:
  domain.TaskStatus:
    enum:
    - pending
    - in_progress
    - completed
    type: string
    x-enum-varnames:
    - TaskStatusPending
    - TaskStatusInProgress
    - TaskStatusCompleted
  dto.AssignTaskRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  dto.CreateTaskRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - title
    type: object
  dto.JoinTeamRequest:
    properties:
      code:
        maxLength: 20
        minLength: 2
        type: string
    required:
    - code
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.UpdateTaskRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.TaskStatus'
        enum:
        - pending
        - in_progress
        - completed
      title:
        maxLength: 255
        minLength: 1
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@taskmanagement.io
    name: API Support
  description: Multi-user task management API with idempotency support.
  termsOfService: http://swagger.io/terms/
  title: Task Management API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password to receive a JWT token
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            type: object
        "429":
          description: Too Many Requests
          schema:
            type: object
      summary: Login
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account and receive a JWT token
      parameters:
      - description: Register payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "409":
          description: Conflict
          schema:
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            type: object
        "429":
          description: Too Many Requests
          schema:
            type: object
      summary: Register new user
      tags:
      - auth
  /api/v1/auth/team:
    delete:
      consumes:
      - application/json
      description: Leave current team
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Leave team
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: 'Join a team by code. Available: ENG (Engineering), DSG (Design),
        PDT (Product)'
      parameters:
      - description: 'codes: ENG, DSG, PDT'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.JoinTeamRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Join team
      tags:
      - auth
  /api/v1/tasks:
    get:
      consumes:
      - application/json
      description: List tasks with optional filtering by status, search by title,
        and pagination
      parameters:
      - description: 'Filter: pending, in_progress, completed'
        in: query
        name: status
        type: string
      - description: Search by title
        in: query
        name: search
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: List tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Create a new task with optional idempotency key for safe retries
      parameters:
      - description: Idempotency key (UUID v4)
        in: header
        name: Idempotency-Key
        type: string
      - description: Create task payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create task
      tags:
      - tasks
  /api/v1/tasks/{id}:
    delete:
      consumes:
      - application/json
      description: Soft-delete a task. Only the task owner can delete.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Delete task
      tags:
      - tasks
    get:
      consumes:
      - application/json
      description: Get a single task by ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get task
      tags:
      - tasks
    put:
      consumes:
      - application/json
      description: 'Partial update — only send fields you want to change. Status:
        pending, in_progress, completed. Example: update just status without title/description.'
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Status: pending, in_progress, completed'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Update task
      tags:
      - tasks
  /api/v1/tasks/{id}/assign:
    post:
      consumes:
      - application/json
      description: Assign a task to another user in the same team. Single database
        transaction.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Assign payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AssignTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Assign task
      tags:
      - tasks
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
